[project]
name = "mesa-de-rol"
version = "0.1.0"
description = "Mesa de rol dirigida por IA: motor d20 simple, estado de partida, visor de dados y fichas, y lecciones entre historias."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mesa = "mesa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `mesa.mapas` es un subpaquete:_maps/ tiene que ir en la lista o el wheel se
# instala sin él y `import mesa.mapas` falla fuera del checkout (test_distribucion).
packages = ["mesa", "mesa.mapas"]

# Copia empaquetada de los recursos inmutables (visor/, partidas/_plantilla/, adaptadores/).
# Se regenera con `bin/mesa recursos sync`; tests/test_distribucion.py vigila que esté en sincronía.
[tool.setuptools.package-data]
mesa = ["recursos/**/*"]
